#
# Build the app, lint and run tests. Meanwhile, build the Docker image, and run the integration and browser tests
# against it. Then, push the image (if this is a push to main and everything passed).
#

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # For the server's tests that need a database (npm run test:db), with the same settings as the development one, in
    # docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parking_radio
          POSTGRES_PASSWORD: parking_radio
          POSTGRES_DB: parking_radio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username parking_radio"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check for schema drift
        run: |
          # drizzle-kit can fail, e.g. on a prompt it can't show here, and still exit with 0, so the check goes by what it prints.
          output="$(npm run db:generate -w server 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if ! grep -q "No schema changes" <<<"$output"; then
            echo "::error::server/src/db/schema.ts doesn't match the committed migration files. Run 'npm run db:generate -w server' and commit the result."
            exit 1
          fi

      # server/openapi.json and client/src/api/schema.d.ts are generated: this fails when they're out of date.
      - name: Check that the API's contract is up to date
        run: npm run check:api

      - run: npm run build
      - run: npm run lint
      - run: npm test

      - run: npm run test:db
        env:
          DATABASE_URL: postgres://parking_radio:parking_radio@localhost:5432/parking_radio

  # The app runs on arm64 in EC2, so the jobs that build, test and push the Docker image use native arm64 Github runners,
  # since that simplifies building and testing it.
  build-docker:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image: ghcr.io/parkingradio/website:${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --tag ghcr.io/parkingradio/website:${{ steps.tag.outputs.tag }} \
                       --tag ghcr.io/parkingradio/website:latest .
          docker save --output image.tar ghcr.io/parkingradio/website:${{ steps.tag.outputs.tag }} \
                                         ghcr.io/parkingradio/website:latest

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1
          overwrite: true

  integration:
    needs: [build-docker]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - run: docker load --input image.tar

      - name: Integration tests
        env:
          PARKING_RADIO_IMAGE: ${{ needs.build-docker.outputs.image }}
        run: npm run test:integration

  e2e:
    needs: [build-docker]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only the headless shell, which is all the tests run.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - run: docker load --input image.tar

      - name: Browser tests
        env:
          PARKING_RADIO_IMAGE: ${{ needs.build-docker.outputs.image }}
        run: npm run test:e2e

      # Playwright's report, with a trace of each test that failed and the server's log, to see what went wrong.
      - name: Upload the browser tests' report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
          # A re-run of the job uploads its report under the same name.
          overwrite: true

  # Only once everything passed, including test-npm, which nothing else waits for. build-docker is listed for its output.
  push:
    needs: [test-npm, build-docker, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - run: docker load --input image.tar

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ needs.build-docker.outputs.image }}
          docker push ghcr.io/parkingradio/website:latest

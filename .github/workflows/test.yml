#
# Build the app, lint and run tests.
# Then, build the Docker image, run the integration tests against it, and push it (if this is a push to main).
#

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check for schema drift
        run: |
          npm run db:generate -w server
          if [ -n "$(git status --porcelain -- server/drizzle)" ]; then
            echo "::error::schema.ts doesn't match the committed migration files. Run 'npm run db:generate -w server' and commit the result."
            git status --porcelain -- server/drizzle
            exit 1
          fi

      - run: npm run build
      - run: npm run lint
      - run: npm test

  build-docker:
    needs: [test-npm]
    # The app runs on arm64 in EC2, so we use native arm64 Github runners since that simplifies
    # building and testing the Docker image.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --tag ghcr.io/parkingradio/radio:${{ steps.tag.outputs.tag }} \
                       --tag ghcr.io/parkingradio/radio:latest .

      - name: Integration tests
        run: npm run test:integration -- ghcr.io/parkingradio/radio:${{ steps.tag.outputs.tag }}

      # Only done when pushing to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/parkingradio/radio:${{ steps.tag.outputs.tag }}
          docker push ghcr.io/parkingradio/radio:latest

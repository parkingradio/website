#
# Build the app, lint and run tests.
# Then, build the Docker image and push it (if this is a push to main).
#

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  build-docker:
    needs: [test-npm]
    # The app runs on arm64 in EC2, so we use native arm64 Github runners since that simplifies
    # building and testing the Docker image.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parking_radio
          POSTGRES_PASSWORD: parking_radio
          POSTGRES_DB: parking_radio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U parking_radio"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --tag ghcr.io/parkingradio/radio:${{ steps.tag.outputs.tag }} \
                       --tag ghcr.io/parkingradio/radio:latest .

      - name: Run container
        run: |
          docker run --detach --init --name parking-radio --network host --env-file .env.example \
                     ghcr.io/parkingradio/radio:${{ steps.tag.outputs.tag }}

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/healthz | grep -q '"ok":true'; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy"
          exit 1

      - name: Check homepage is served
        run: curl --silent --fail http://localhost:3000/ | grep -qi '<title>Parking Radio</title>'

      - name: Container logs
        if: always()
        run: docker logs parking-radio

      # Only done when pushing to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/parkingradio/radio:${{ steps.tag.outputs.tag }}
          docker push ghcr.io/parkingradio/radio:latest

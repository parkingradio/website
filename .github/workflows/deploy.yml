name: Deploy
run-name: "Deploy ${{ inputs.app_image_tag }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      app_image_tag:
        description: "Tag of the ghcr.io/parkingradio/radio image to deploy"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: deployment/main
        run: terraform init

      - name: Terraform apply
        working-directory: deployment/main
        run: |
          terraform apply -auto-approve                                     \
            -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -var="cloudflare_zone_id=${{ vars.CLOUDFLARE_ZONE_ID }}"        \
            -var="domain=${{ vars.DOMAIN }}"                                \
            -var="app_image_tag=${{ inputs.app_image_tag }}"

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail --max-time 10 "https://${{ vars.DOMAIN }}/healthz" | grep -q '"ok":true'; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Server never became healthy"
          exit 1

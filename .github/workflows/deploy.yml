name: Deploy
run-name: "Deploy ${{ inputs.app_image_tag }} to ${{ inputs.environment }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - test
          - production
      app_image_tag:
        description: "Tag of the ghcr.io/parkingradio/radio image to deploy"
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.DOMAIN }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Enforce MANAGE_MAIL is set
        env:
          MANAGE_MAIL: ${{ vars.MANAGE_MAIL }}
        run: |
          if [ "$MANAGE_MAIL" != "true" ] && [ "$MANAGE_MAIL" != "false" ]; then
            echo "::error::MANAGE_MAIL must be set to 'true' or 'false', got '$MANAGE_MAIL'"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: deployment/main
        run: terraform init

      - name: Select the environment's workspace
        working-directory: deployment/main
        run: terraform workspace select -or-create "${{ inputs.environment }}"

      - name: Terraform apply
        working-directory: deployment/main
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_manage_mail: ${{ vars.MANAGE_MAIL }}
          TF_VAR_soundcloud_client_id: ${{ vars.SOUNDCLOUD_CLIENT_ID }}
          TF_VAR_soundcloud_client_secret: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          TF_VAR_app_image_tag: ${{ inputs.app_image_tag }}
        run: terraform apply -auto-approve

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail --max-time 10 "https://${{ vars.DOMAIN }}/healthz" | grep -q '"ok":true'; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Server never became healthy"
          exit 1
